[project]
name = "certwatch"
version = "0.1.0"
description = "CertWatch — AI-assisted, deterministic-first TLS certificate discovery and expiry monitoring (MVP v0)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- Web framework / API (Section 2, 13, 14: FastAPI monolith, server-rendered UI) ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",          # server-rendered report/UI templates (Section 2: no React/SPA at v0)
    "python-multipart>=0.0.9",    # required by FastAPI for form/file upload parsing (host-list upload)

    # --- Configuration (Section 24: server-side env config, never client-controlled) ---
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # --- Certificate parsing & path validation (Section 8, Decision Log) ---
    # cryptography: X.509 field parsing, signature primitives. Does NOT perform PKIX path
    # building/validation on its own — kept only for low-level parsing, not chain validation.
    "cryptography>=42.0",
    # pyhanko-certvalidator: RFC 5280 path building + validation, handles cross-signed
    # certificates and alternate paths. This is the actual chain-validation engine (Section 8);
    # cryptography + certifi alone was an overclaim, corrected in the Decision Log.
    "pyhanko-certvalidator>=0.26,<1.0",
    "certifi>=2024.7.4",          # maintained public trust-root bundle used as Pass 1's trust anchor
    # asn1crypto: pyhanko-certvalidator's own certificate representation. Pinned explicitly
    # (M1 decision, Decision Log) because app.parsing imports it directly to build
    # ValidationContext trust roots — never relied on only as a transitive dependency.
    "asn1crypto>=1.5.1",

    # --- TLS scanning (Section 6, 7, Decision Log — M2) ---
    # pyOpenSSL: retrieves the FULL server-presented certificate chain
    # (leaf + intermediates) via OpenSSL's SSL_get_peer_cert_chain(). The
    # stdlib `ssl` module has no public API for this in this Python
    # version (SSLSocket.getpeercert() returns the leaf only) — confirmed
    # by direct introspection before choosing this dependency.
    "pyopenssl>=24.0",

    # --- Object storage abstraction (Section 11: no PostgreSQL at v0) ---
    # No cloud SDK (boto3 / azure-storage-blob / etc.) is pinned yet — cloud provider selection
    # is an explicit M2 gate (Decision Log). M0 ships only a local-filesystem backend behind the
    # same interface, so local development needs no cloud credentials at all.

    # --- Rate limiting (Section 18) ---
    "slowapi>=0.1.9,<1.0",        # simple per-IP rate limiting for FastAPI; no external service required at v0

    # --- Report generation (Section 15 — dependency declared now, wiring deferred to M5) ---
    "weasyprint>=62.0",           # server-side HTML→PDF rendering, no separate rendering service

    # --- AI analyst layer (Section 16, 17, Section 28 open decision #3, M7) ---
    # anthropic: the chosen v0 LLM provider's SDK, resolving Section 28's open
    # provider-selection decision (Decision Log). Used only behind
    # app.ai.llm_client.LLMProvider (Section 17's "Provider abstraction"
    # requirement) — app.ai.analyst and the /ask route never import it directly.
    "anthropic>=0.40,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",           # FastAPI TestClient transport
    "ruff>=0.5,<1.0",             # lint + format, single tool
    "mypy>=1.10,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's Depends()/Query()/Path() defaults are the framework's own
# idiom for dependency injection, not the mutable-default-argument bug
# B008 exists to catch (M3 implementation note, Decision Log). File()/Form()
# are the same idiom for the M6 web-form routes (Decision Log).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# asn1crypto ships no type stubs / py.typed marker (M1 implementation note,
# Decision Log) — it is used only in app.parsing for feeding pyhanko-certvalidator,
# never for anything mypy needs to check the shape of beyond what's cast explicitly.
[[tool.mypy.overrides]]
module = ["asn1crypto.*"]
ignore_missing_imports = true

# weasyprint ships no type stubs / py.typed marker (M5 implementation note,
# Decision Log) — used only in app.reports.report_builder for one call
# (HTML(...).write_pdf()) whose return type is cast explicitly in that module.
[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# M9: real-network e2e tests (tests/e2e/) hit real public hosts over real
# DNS/TCP/TLS — no monkeypatched scan_hosts — so they're opt-in, not part
# of the default fast/CI-friendly run every other milestone's `pytest -q`
# has relied on. Run them explicitly with `pytest -m e2e` (Decision Log).
markers = ["e2e: real-network end-to-end tests against public test hosts (opt-in, see tests/e2e/)"]
addopts = "-m 'not e2e'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
