name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Provider-independent: this job only ever runs pip installs, lint, type-check
    # and pytest against the local-filesystem storage backend. No cloud credentials,
    # no cloud SDK, and no live network scanning are used or required at M0.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest -v --cov=app --cov-report=term-missing
